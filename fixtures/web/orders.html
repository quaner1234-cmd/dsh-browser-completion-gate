<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orders — DSH fixture</title>
<style>
  body{font-family:system-ui,sans-serif;background:#f5f6f8;margin:0}
  main{max-width:640px;margin:48px auto;background:#fff;border:1px solid #e2e4e8;border-radius:8px;padding:24px 32px}
  h1{font-size:20px;margin:0 0 4px}
  .muted{color:#667;font-size:13px}
  .card{border:1px solid #e2e4e8;border-radius:8px;padding:16px;margin:14px 0;display:flex;align-items:center;justify-content:space-between}
  .right{display:flex;align-items:center;gap:12px}
  .badge{font-size:12px;padding:3px 10px;border-radius:999px;background:#eef1f6;color:#445}
  .badge.shipped{background:#e8f7ee;color:#14663a}
  button{padding:8px 16px;font-size:14px;border:none;border-radius:6px;background:#2a6df4;color:#fff;cursor:pointer}
  button:disabled{opacity:.5}
  #toast{margin-top:14px;padding:10px 12px;border-radius:6px;font-size:14px;display:none}
  #toast.ok{display:block;background:#e8f7ee;color:#14663a;border:1px solid #b8e4c8}
  #toast.err{display:block;background:#fdecec;color:#a02424;border:1px solid #f0c2c2}
</style>
</head>
<body>
<main>
  <h1>Orders</h1>
  <p class="muted">2 orders &middot; operations are recorded server-side</p>
  <div id="list"></div>
  <div id="toast"></div>
</main>
<script>
  const list = document.getElementById('list')
  const toastEl = document.getElementById('toast')

  async function load() {
    const r = await fetch('/api/orders')
    const { orders } = await r.json()
    list.innerHTML = ''
    for (const o of orders) {
      const card = document.createElement('div')
      card.className = 'card'
      card.innerHTML =
        '<div><strong>Order #' + o.id + '</strong><div class="muted">Customer: ' + o.customer + '</div></div>' +
        '<div class="right">' +
        '<span class="badge ' + o.status + '">' + (o.status === 'new' ? 'New' : 'Shipped') + '</span>' +
        (o.status === 'new' ? '<button data-id="' + o.id + '">Mark shipped</button>' : '') +
        '</div>'
      list.appendChild(card)
    }
  }

  list.addEventListener('click', async (ev) => {
    const btn = ev.target.closest('button[data-id]')
    if (!btn) return
    btn.disabled = true
    const r = await fetch('/api/orders/ship', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ orderId: btn.dataset.id }),
    })
    const data = await r.json()
    toastEl.textContent = data.ok ? 'Order marked as shipped' : (data.message || 'Error')
    toastEl.className = data.ok ? 'ok' : 'err'
    load()
  })

  load()
</script>
</body>
</html>
