<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Account settings — DSH fixture</title>
<style>
  body{font-family:system-ui,sans-serif;background:#f5f6f8;margin:0}
  main{max-width:640px;margin:48px auto;background:#fff;border:1px solid #e2e4e8;border-radius:8px;padding:24px 32px}
  h1{font-size:20px;margin:0 0 4px}
  .muted{color:#667;font-size:13px}
  label{display:block;margin:20px 0 6px;font-weight:600;font-size:14px}
  input{width:100%;box-sizing:border-box;padding:8px 10px;font-size:15px;border:1px solid #c8ccd4;border-radius:6px}
  button{margin-top:16px;padding:9px 18px;font-size:14px;border:none;border-radius:6px;background:#2a6df4;color:#fff;cursor:pointer}
  button:disabled{opacity:.6}
  #toast{margin-top:14px;padding:10px 12px;border-radius:6px;font-size:14px;display:none}
  #toast.ok{display:block;background:#e8f7ee;color:#14663a;border:1px solid #b8e4c8}
  #toast.err{display:block;background:#fdecec;color:#a02424;border:1px solid #f0c2c2}
  #hint{margin-top:18px;font-size:12px;color:#889;border-top:1px solid #eee;padding-top:12px}
</style>
</head>
<body>
<main>
  <h1>Account settings</h1>
  <p class="muted">Public profile &middot; changes take effect after saving</p>
  <label for="name">Display name</label>
  <input id="name" type="text" autocomplete="off">
  <button id="save">Save changes</button>
  <div id="toast"></div>
  <p id="hint">Saved values are validated by the server before they become permanent.</p>
</main>
<script>
  const input = document.getElementById('name')
  const btn = document.getElementById('save')
  const toastEl = document.getElementById('toast')
  let lastSubmitted = null

  async function refresh() {
    const r = await fetch('/api/profile')
    const data = await r.json()
    input.value = data.displayName
    return data.displayName
  }

  function toast(msg, ok) {
    toastEl.textContent = msg
    toastEl.className = ok ? 'ok' : 'err'
  }

  btn.addEventListener('click', async () => {
    btn.disabled = true
    const submitted = input.value.trim()
    lastSubmitted = submitted
    const r = await fetch('/api/profile/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: submitted }),
    })
    const data = await r.json()
    if (!data.ok) {
      toast(data.message || 'Save failed', false)
      btn.disabled = false
      return
    }
    // Optimistic success signal — the server verdict arrives shortly after.
    toast('Saved', true)
    setTimeout(async () => {
      const current = await refresh()
      if (current !== lastSubmitted) {
        toast('Save failed: the server rejected the change &mdash; display name reverted.', false)
      } else {
        toast('Save confirmed by server.', true)
      }
      btn.disabled = false
    }, 2600)
  })

  refresh()
</script>
</body>
</html>
